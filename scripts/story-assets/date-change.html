<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bell Pepper Open — Date Change</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    color: #ffffff;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    position: relative;
  }

  /* Background gradient glow */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(74, 222, 128, 0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(249, 115, 22, 0.15) 0%, transparent 60%);
  }

  /* Subtle grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
  }

  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 120px 80px 140px;
  }

  /* Top: brand */
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: 'Space Mono', monospace;
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #4ADE80;
  }

  .brand .dot {
    width: 14px;
    height: 14px;
    background: #4ADE80;
    border-radius: 2px;
    box-shadow: 0 0 24px #4ADE80;
  }

  /* Heat indicator */
  .heat {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.28em;
    color: #4ADE80;
    text-transform: uppercase;
  }

  .heat-bars {
    display: flex;
    gap: 6px;
  }

  .heat-bar {
    width: 26px;
    height: 14px;
    background: #1f1f1f;
    border-radius: 2px;
  }

  .heat-bar.active {
    background: #4ADE80;
    box-shadow: 0 0 10px rgba(74,222,128,0.7);
  }

  /* Alert badge */
  .alert {
    margin-top: 50px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    align-self: flex-start;
    padding: 14px 26px;
    background: rgba(249, 115, 22, 0.12);
    border: 1.5px solid #F97316;
    border-radius: 999px;
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #F97316;
  }

  .alert .pulse {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #F97316;
    box-shadow: 0 0 16px #F97316;
  }

  /* Title */
  .title {
    margin-top: 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 168px;
    line-height: 0.92;
    letter-spacing: -0.01em;
    color: #ffffff;
  }

  .title .accent {
    color: #4ADE80;
  }

  /* Mascot */
  .mascot-wrap {
    position: relative;
    margin-top: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 520px;
  }

  .mascot-wrap::before {
    content: '';
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,0.55) 0%, rgba(249,115,22,0.0) 65%);
    filter: blur(20px);
  }

  .mascot {
    position: relative;
    height: 520px;
    width: auto;
    z-index: 2;
  }

  /* Date block */
  .dates {
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 50px;
  }

  .date {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .date .label {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-bottom: 12px;
  }

  .date.old .label { color: rgba(249,115,22,0.7); }
  .date.new .label { color: #4ADE80; }

  .date .month {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    line-height: 1;
    letter-spacing: 0.05em;
    color: #ffffff;
  }

  .date .day {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 168px;
    line-height: 0.9;
    letter-spacing: -0.02em;
  }

  .date.old .day {
    color: rgba(255,255,255,0.35);
    position: relative;
  }

  .date.old .day::after {
    content: '';
    position: absolute;
    left: -10px;
    right: -10px;
    top: 55%;
    height: 8px;
    background: #F97316;
    transform: rotate(-8deg);
    box-shadow: 0 0 12px rgba(249,115,22,0.6);
  }

  .date.new .day {
    color: #4ADE80;
    text-shadow: 0 0 30px rgba(74,222,128,0.5);
  }

  .arrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 90px;
    color: #F97316;
    line-height: 1;
    padding-bottom: 30px;
  }

  /* Footer */
  .footer {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
  }

  .footer .day-of-week {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    letter-spacing: 0.04em;
    color: #ffffff;
  }

  .footer .meta {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
  }

  .footer .url {
    margin-top: 18px;
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    letter-spacing: 0.18em;
    color: #4ADE80;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="frame">
    <div class="brand">
      <span class="dot"></span>
      Let's Pepper
    </div>

    <div class="heat">
      <span class="heat-bars">
        <span class="heat-bar active"></span>
        <span class="heat-bar"></span>
        <span class="heat-bar"></span>
      </span>
      Mild · Season Opener
    </div>

    <div class="alert">
      <span class="pulse"></span>
      Date Change
    </div>

    <div class="title">
      The Bell<br/>Pepper <span class="accent">Open</span>
    </div>

    <div class="mascot-wrap">
      <img class="mascot" src="bell.png" alt="" />
    </div>

    <div class="dates">
      <div class="date old">
        <div class="label">Was</div>
        <div class="month">June</div>
        <div class="day">6</div>
      </div>
      <div class="arrow">→</div>
      <div class="date new">
        <div class="label">Now</div>
        <div class="month">June</div>
        <div class="day">7</div>
      </div>
    </div>

    <div class="footer">
      <div class="day-of-week">Sunday · 2026</div>
      <div class="meta">Nature Meadows Park · Aurora, IL</div>
      <div class="url">letspepper.com</div>
    </div>
  </div>
</body>
</html>
