<!DOCTYPE html>
<!-- Series calendar — a dated list on the near-black ground. Date tile left (month
     over day) tinted by the row's heat, name and venue right, heat chip on the end.
     A row with status "cancelled" keeps its place and stops advertising: struck
     name, Habanero chip, no heat tint. Renders 1080x1350 (feed) and 1080x1920
     (story) from RENDER_DATA.format. -->
<html><head><meta charset="utf-8"><title>Series schedule</title>
<link rel="stylesheet" href="_base.css">
<style>
  /* The mascot sits below the topline, never over it — a handle or a pull date
     half-covered by artwork is the tell that the card was never looked at. */
  .head { flex: 0 0 auto; position: relative; margin-top: 20px; padding-right: 196px; }
  .title { margin-top: 14px; font-family: 'Anton', sans-serif; font-size: 108px; line-height: 0.88;
           text-transform: uppercase; color: var(--fg); }
  .title em { font-style: normal; color: var(--heat);
              text-shadow: 0 0 60px rgba(var(--heat-rgb), 0.5); }
  .sub { margin-top: 14px; font-size: 20px; font-weight: 700; letter-spacing: 0.18em;
         text-transform: uppercase; color: var(--fg2); }
  .mascot { position: absolute; right: -10px; top: 6px; width: 178px;
            filter: drop-shadow(0 24px 44px rgba(0,0,0,0.7)); }
  body.story .title { font-size: 128px; }
  body.story .sub { font-size: 23px; }
  body.story .mascot { width: 210px; top: 10px; }

  .rows { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
          justify-content: center; gap: 14px; padding: 36px 0; }
  /* Rows share the space instead of clustering: three events and eight both fill. */
  .r { flex: 1 1 0; max-height: 212px; }
  .r { display: flex; align-items: center; gap: 26px; padding: 20px 24px;
       background: rgba(26,26,26,0.62); border: 1px solid var(--line);
       border-left: 5px solid var(--rh); border-radius: 12px; }
  .r .date { flex: 0 0 104px; text-align: center; }
  .r .m { font-size: 17px; font-weight: 700; letter-spacing: 0.20em;
          text-transform: uppercase; color: var(--rh); }
  .r .d { font-family: 'Bebas Neue', sans-serif; font-size: 62px; line-height: 0.92;
          letter-spacing: 0.02em; color: var(--fg); }
  .r .who { flex: 1 1 auto; min-width: 0; }
  .r .n { font-family: 'Bebas Neue', sans-serif; font-size: 50px; line-height: 1.02;
          letter-spacing: 0.03em; color: var(--fg); }
  .r .v { margin-top: 5px; font-size: 17px; letter-spacing: 0.10em;
          text-transform: uppercase; color: var(--fg3); }
  .r .chip { flex: 0 0 auto; font-size: 16px; font-weight: 700; letter-spacing: 0.18em;
             text-transform: uppercase; color: var(--rh);
             border: 1px solid var(--rh); border-radius: 9999px; padding: 9px 16px; }
  .r.off { background: rgba(20,20,20,0.5); }
  .r.off .n { color: var(--fg3); text-decoration: line-through;
              text-decoration-thickness: 3px; text-decoration-color: var(--alert); }
  .r.off .d, .r.off .v { color: var(--fg3); }
  body.story .r { padding: 26px 26px; gap: 30px; max-height: 258px; }
  body.story .r .d { font-size: 72px; }
  body.story .r .n { font-size: 58px; }
  body.story .r .v { font-size: 19px; }
  body.story .r .chip { font-size: 18px; }

  .tail { flex: 0 0 auto; display: flex; flex-direction: column; gap: 16px;
          padding-top: 26px; border-top: 1px solid var(--line); }
  .tail .cta { font-family: 'Bebas Neue', sans-serif; font-size: 46px; letter-spacing: 0.04em;
               color: var(--heat); }
  body.story .tail .cta { font-size: 54px; }
</style></head>
<body>
  <div class="ground"></div><div class="grain"></div><div class="vignette"></div>
  <div class="frame">
    <div class="gate" id="gate">SAMPLE DATA — NOT FOR PUBLICATION</div>
    <div class="topline"><span id="handle"></span><span class="stamp" id="stamp"></span></div>
    <div class="head">
      <img class="mascot" id="mascot" hidden>
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="tail"><div class="cta" id="cta"></div><div class="foot" id="foot"></div></div>
  </div>
<script>
const D = window.RENDER_DATA || {};
// Elements are looked up explicitly, never through the id-as-global shortcut:
// `event`, `close` and `name` are built-in window properties, and assigning
// through them throws mid-script, leaving a half-populated card that still
// screenshots cleanly.
const $ = (id) => document.getElementById(id);
const REQUIRED = ['handle','eyebrow','title','sub','cta','foot'];
function paint() {
const HEAT = { mild: ['#4ade80','74, 222, 128'], medium: ['#facc15','250, 204, 21'], hot: ['#f97316','249, 115, 22'] };
const [hex, rgb] = HEAT[D.heat] || HEAT.hot;
document.documentElement.style.setProperty('--heat', hex);
document.documentElement.style.setProperty('--heat-rgb', rgb);
document.body.className = D.format === 'story' ? 'story' : 'feed';

if (D.facts_confirmed) $('gate').remove();
$('handle').textContent  = D.handle  || '';
$('stamp').textContent   = D.stamp   || '';
$('eyebrow').textContent = D.eyebrow || '';
$('sub').textContent     = D.subtitle || '';
$('cta').textContent     = D.cta     || '';
$('foot').textContent    = D.footer  || '';
if (D.mascot) { $('mascot').src = D.mascot; $('mascot').alt = D.mascot_alt || ''; $('mascot').hidden = false; }

// "2026|SEASON" sets the second word in the heat color.
const t = (D.title || '').split('|');
$('title').innerHTML = '<span></span><em></em>';
$('title').children[0].textContent = t[0].trim() + (t[1] ? ' ' : '');
$('title').children[1].textContent = (t[1] || '').trim();

$('rows').innerHTML = (D.rows || []).map(() =>
  '<div class="r"><div class="date"><div class="m"></div><div class="d"></div></div>' +
  '<div class="who"><div class="n"></div><div class="v"></div></div>' +
  '<div class="chip"></div></div>').join('');
[...rows.children].forEach((el, i) => {
  const r = D.rows[i], off = r.status === 'cancelled';
  el.style.setProperty('--rh', off ? '#ef4444' : (HEAT[r.heat] || HEAT.hot)[0]);
  if (off) el.classList.add('off');
  el.querySelector('.m').textContent = r.m;
  el.querySelector('.d').textContent = r.d;
  el.querySelector('.n').textContent = r.name;
  el.querySelector('.v').textContent = r.where || '';
  el.querySelector('.chip').textContent = r.chip || '';
});
}

/* Populate inside a guard: a throw here otherwise yields a clean-looking card with
 * the facts silently absent. REQUIRED lists the nodes that must end up non-empty. */
function fault(msg) {
  const d = document.createElement('div');
  d.className = 'fault';
  d.innerHTML = '<b></b><span></span>';
  d.children[0].textContent = 'Render fault — do not publish';
  d.children[1].textContent = msg;
  document.body.appendChild(d);
}
try {
  paint();
  const empty = REQUIRED.filter((id) => !($(id).textContent || '').trim());
  if (empty.length) fault('empty after populate: ' + empty.join(', '));
} catch (err) {
  fault((err && err.message) || String(err));
}
</script></body></html>
