<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Let's Pepper — Story Asset</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bell: #4ade80;
    --poblano: #facc15;
    --jalapeno: #f97316;
    --reaper: #dc2626;
  }

  body {
    width: 1080px;
    height: 1920px;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    color: #ffffff;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    position: relative;
  }

  /* Background gradient glow — accent-driven */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, var(--glow-top, rgba(250, 204, 21, 0.18)) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, var(--glow-bot, rgba(249, 115, 22, 0.15)) 0%, transparent 60%);
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
  }

  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 120px 80px 140px;
  }

  /* Top: brand */
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: 'Space Mono', monospace;
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--poblano);
  }
  .brand .dot {
    width: 14px;
    height: 14px;
    background: var(--poblano);
    border-radius: 2px;
    box-shadow: 0 0 24px var(--poblano);
  }

  /* Eyebrow / section label */
  .eyebrow {
    margin-top: 30px;
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }

  /* Badge */
  .badge {
    margin-top: 50px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    align-self: flex-start;
    padding: 14px 28px;
    background: var(--badge-bg, rgba(250, 204, 21, 0.12));
    border: 1.5px solid var(--badge-bd, var(--poblano));
    border-radius: 999px;
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--badge-bd, var(--poblano));
  }
  .badge .pulse {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--badge-bd, var(--poblano));
    box-shadow: 0 0 16px var(--badge-bd, var(--poblano));
  }

  /* Title */
  .title {
    margin-top: 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 188px;
    line-height: 0.9;
    letter-spacing: -0.01em;
    color: #ffffff;
  }
  .title .accent { color: var(--poblano); }

  .subtitle {
    margin-top: 28px;
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.7);
    line-height: 1.5;
  }

  /* Mascot */
  .mascot-wrap {
    position: relative;
    margin-top: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 480px;
  }
  .mascot-wrap::before {
    content: '';
    position: absolute;
    width: 460px;
    height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--mascot-glow, rgba(250,204,21,0.45)) 0%, rgba(0,0,0,0) 65%);
    filter: blur(20px);
  }
  .mascot {
    position: relative;
    height: 480px;
    width: auto;
    z-index: 2;
  }

  /* Points legend (announcement) */
  .legend {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .tier {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 20px 28px;
    border-radius: 16px;
    border: 1.5px solid var(--c);
    background: color-mix(in srgb, var(--c) 8%, transparent);
  }
  .tier .pts {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    line-height: 1;
    color: var(--c);
    width: 130px;
    text-shadow: 0 0 24px color-mix(in srgb, var(--c) 60%, transparent);
  }
  .tier .pts small {
    font-size: 26px;
    letter-spacing: 0.04em;
  }
  .tier .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 46px;
    letter-spacing: 0.04em;
    color: #fff;
  }
  .tier .desc {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-left: auto;
  }

  /* Prop card body — fills space between brand and footer, centered */
  .prop-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .prop-heat {
    margin-top: 0;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    align-self: flex-start;
    padding: 14px 28px;
    border-radius: 999px;
    border: 1.5px solid var(--c);
    background: color-mix(in srgb, var(--c) 10%, transparent);
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--c);
  }
  .question {
    margin-top: 36px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 110px;
    line-height: 0.94;
    letter-spacing: -0.005em;
    color: #fff;
  }
  .options {
    margin-top: 56px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 28px 32px;
    border-radius: 16px;
    border: 1.5px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.03);
    font-family: 'Inter', sans-serif;
    font-size: 34px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
  }
  .option .key {
    font-family: 'Space Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    color: var(--c);
    width: 44px;
    text-align: center;
    flex-shrink: 0;
  }

  /* Footer */
  .footer {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
  }
  .footer .cta {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    letter-spacing: 0.04em;
    color: #fff;
  }
  .footer .meta {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
  }
  .footer .url {
    margin-top: 18px;
    font-family: 'Space Mono', monospace;
    font-size: 26px;
    letter-spacing: 0.16em;
    color: var(--poblano);
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="frame" id="frame"></div>
</body>
</html>
