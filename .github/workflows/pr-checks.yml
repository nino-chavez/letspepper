name: PR checks

# Cloudflare Pages' GitHub connection builds and deploys the site: a preview for
# every branch, production on merge to main. These checks are what Cloudflare's
# build does not run. They gate the merge, so a failure stops the change before
# it ships rather than after.

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json "packageManager", the same pnpm
      # Cloudflare's build image runs.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        # Fails when package.json and pnpm-lock.yaml disagree; Cloudflare's
        # build installs the same way.
        run: pnpm install --frozen-lockfile

      - name: Check mascot derivatives
        # Fails fast if src/ references an anime/web derivative that was never
        # committed (this shipped a 404 header logo once).
        run: node scripts/site/derive-mascot-images.mjs --check

      - name: Reader clarity contract
        # Fails when website copy changed since the last recorded review. Walk
        # the branch's Cloudflare preview, then record a new receipt (see
        # CLAUDE.md, "Deploys").
        run: pnpm reader:check:website
