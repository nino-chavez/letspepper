name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

env:
  # Opt the marketplace actions onto the Node 24 runtime ahead of the
  # 2026-06-16 forced migration (checkout / setup-node / pnpm action-setup
  # @v4 all support it). Removes the Node 20 deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mascot derivatives
        # Fails fast if src/ references an anime/web derivative that was never
        # committed (this shipped a 404 header logo once).
        run: node scripts/site/derive-mascot-images.mjs --check

      - name: Build for Cloudflare Pages
        # Vercel CLI 56 gates unlinked `vercel build` behind project settings,
        # and `--yes` tries to auto-link via the Vercel API (needs auth — fails
        # here with "token is not valid"). Writing local settings first keeps
        # the build fully offline: no Vercel account, no linking. next-on-pages
        # then consumes the prebuilt output.
        run: |
          mkdir -p .vercel
          echo '{"projectId":"_","orgId":"_","settings":{"framework":"nextjs"}}' > .vercel/project.json
          pnpm dlx vercel build --yes
          pnpm dlx @cloudflare/next-on-pages@1 --skip-build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy .vercel/output/static --project-name=letspepper --branch=main --commit-dirty=true
