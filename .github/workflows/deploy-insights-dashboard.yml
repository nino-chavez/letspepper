name: Insights dashboard

# Tests the 630 Instagram insights dashboard on every pull request that touches it, and
# tests then deploys the 630-instagram-insights Worker when such a change lands on main.
# It reads the scheduler's database and imports the scheduler's day helpers, so changes
# to those also run here. It never applies migrations: deploy-social-worker.yml owns the
# schema. A pull request never deploys.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/social-publish/insights-dashboard/**'
      - 'scripts/social-publish/worker/src/insights.js'
      - 'scripts/social-publish/worker/migrations/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-insights-dashboard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/social-publish/insights-dashboard/**'
      - 'scripts/social-publish/worker/src/insights.js'
      - 'scripts/social-publish/worker/migrations/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-insights-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insights-dashboard-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Decide whether this run deploys
        id: deploy
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Insights dashboard deployment skipped: Cloudflare credentials are absent."
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify dashboard
        run: pnpm social:dashboard:test
      - name: Deploy dashboard
        if: steps.deploy.outputs.ready == 'true'
        run: pnpm exec wrangler deploy --config scripts/social-publish/insights-dashboard/wrangler.jsonc
