<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Palette is the product's own desktop tokens, not a free pick — these are the
     literal oklch values from film-room/packages/design-tokens/css/desktop.css,
     so a card sitting beside a real app screenshot in a carousel matches it. */
  :root {
    --bg:      oklch(0.1820 0.0044 264.5);
    --surface: oklch(0.2346 0.0083 264.4);
    --line:    oklch(0.3628 0.0132 261.7);
    --text:    oklch(0.9610 0.0083 91.5);
    --accent:  oklch(0.7648 0.1385 77.5);
    --muted:   oklch(0.7200 0.0110 264.0);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 30px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    padding: 84px 78px 72px;
  }
  .rule { height: 6px; background: var(--accent); border-radius: 3px; width: 96px; }

  header { display: flex; align-items: center; gap: 18px; }
  .mark {
    width: 56px; height: 56px; border-radius: 13px;
    background: var(--accent); color: var(--bg);
    display: grid; place-items: center;
    font-size: 25px; font-weight: 800; letter-spacing: -.5px;
  }
  .wordmark { font-size: 31px; font-weight: 700; letter-spacing: -.3px; }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 0; }
  .kicker {
    font-size: 24px; font-weight: 700; letter-spacing: 2.6px;
    text-transform: uppercase; color: var(--accent); margin-bottom: 30px;
  }
  h1 {
    font-size: 82px; line-height: 1.08; font-weight: 700;
    letter-spacing: -2.2px; margin-bottom: 34px;
  }
  h1.small { font-size: 66px; letter-spacing: -1.6px; }
  .lead { font-size: 34px; line-height: 1.45; color: var(--muted); max-width: 20ch; }

  ul { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 20px; }
  li {
    font-size: 36px; line-height: 1.32; padding-left: 42px; position: relative;
  }
  li::before {
    content: ""; position: absolute; left: 0; top: 17px;
    width: 20px; height: 3px; background: var(--accent); border-radius: 2px;
  }
  ol { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 30px; counter-reset: q; }
  ol li { padding-left: 66px; }
  ol li::before {
    counter-increment: q; content: counter(q);
    width: auto; height: auto; background: none; top: 0;
    font-size: 30px; font-weight: 700; color: var(--accent);
    border: 2px solid var(--line); border-radius: 9px;
    padding: 3px 15px; line-height: 1.3;
  }

  footer { display: flex; flex-direction: column; gap: 20px; }
  .foot-line { font-size: 26px; color: var(--muted); letter-spacing: .2px; }
</style>
</head>
<body>
  <header>
    <div class="mark">CB</div>
    <div class="wordmark">Cutting Board</div>
  </header>
  <main>
    <div class="kicker" id="kicker"></div>
    <h1 id="headline"></h1>
    <p class="lead" id="lead"></p>
    <div id="list"></div>
  </main>
  <footer>
    <div class="rule"></div>
    <div class="foot-line" id="foot"></div>
  </footer>

<script>
  const d = window.RENDER_DATA || {};
  const set = (id, v) => { const el = document.getElementById(id); if (v) el.textContent = v; else el.remove(); };
  set('kicker', d.kicker);
  set('headline', d.headline);
  set('lead', d.lead);
  set('foot', d.foot);
  if (d.headlineSmall) document.getElementById('headline')?.classList.add('small');
  const wrap = document.getElementById('list');
  if (d.items && d.items.length) {
    const el = document.createElement(d.ordered ? 'ol' : 'ul');
    for (const item of d.items) {
      const li = document.createElement('li');
      li.textContent = item;
      el.appendChild(li);
    }
    wrap.appendChild(el);
  } else {
    wrap.remove();
  }
</script>
</body>
</html>
