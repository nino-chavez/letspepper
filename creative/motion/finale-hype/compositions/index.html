        (function () {
          window.__timelines = window.__timelines || {};

          var PALETTE = {
            ink: "#070707",
            paper: "#f4f1e8",
            lime: "#a3e635",
            orange: "#f97316",
            yellow: "#facc15",
          };

          /* s3 eyebrow — typewriter via per-char reveal (deterministic split at build) */
          var eyebrow = document.getElementById("fh-s3-eyebrow");
          var ebText = eyebrow.textContent;
          eyebrow.textContent = "";
          ebText.split("").forEach(function (ch, i) {
            var span = document.createElement("span");
            span.className = "s3-ch";
            span.id = "fh-s3-ch-" + i;
            span.textContent = ch === " " ? " " : ch;
            eyebrow.appendChild(span);
          });

          /* s5 counter — apple-money-count mechanics: seek-safe proxy tween, tabular render */
          var amountEl = document.getElementById("fh-s5-amount");
          var countState = { value: 0 };
          function renderAmount(v) {
            var bounded = Math.max(0, Math.min(2000, Math.round(v)));
            amountEl.textContent = "$" + bounded.toLocaleString("en-US");
          }
          renderAmount(0);

          /* s5 burst — apple-money-count golden-angle spread, rebranded orange/yellow,
             adapted to the 1080x1920 portrait canvas. Fully deterministic. */
          var burstHost = document.getElementById("fh-s5-burst");
          var moneyIcons = [];
          var moneySpecs = [];
          for (var i = 0; i < 36; i += 1) {
            var icon = document.createElement("div");
            var isCoin = i % 3 === 0;
            icon.className = "money-icon " + (isCoin ? "coin" : "bill");
            icon.innerHTML = '<span class="mark">$</span>';
            burstHost.appendChild(icon);
            moneyIcons.push(icon);

            var angle = i * 2.399963229728653;
            var ring = i % 5;
            var radiusX = 190 + ring * 78 + (i % 7) * 10;
            var radiusY = 280 + ring * 130 + (i % 6) * 14;
            var offsetX = (i % 4) * 22 - 33;
            var offsetY = (i % 5) * 18 - 36;
            var x = Math.max(-470, Math.min(470, Math.cos(angle) * radiusX + offsetX));
            var y = Math.max(-740, Math.min(740, Math.sin(angle * 1.13) * radiusY + offsetY));

            moneySpecs.push({
              x: x,
              y: y,
              delay: (i % 8) * 0.025,
              duration: 0.6 + (i % 5) * 0.045,
              fadeDelay: (i % 5) * 0.05,
              rotation: ((i * 43) % 160) - 80,
              scale: isCoin ? 0.72 + (i % 4) * 0.08 : 0.68 + (i % 5) * 0.07,
            });
          }
          gsap.set(moneyIcons, {
            x: 0,
            y: 0,
            xPercent: -50,
            yPercent: -50,
            opacity: 0,
            scale: 0.18,
            transformOrigin: "50% 50%",
          });

          var tl = gsap.timeline({ paused: true });

          /* ===== s1 · hook (0.0–1.2) — slam lands 0.12, serve-snap fires 0.0 ===== */
          tl.fromTo(
            "#fh-s1-head",
            { y: -300, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.12, ease: "power4.out" },
            0
          );
          tl.to(
            "#fh-s1-head",
            { keyframes: [{ x: -9 }, { x: 9 }, { x: 0 }], duration: 0.18, ease: "none" },
            0.12
          );
          tl.fromTo("#fh-s1-flash", { opacity: 0 }, { opacity: 0.9, duration: 0.033, ease: "none" }, 0.12);
          tl.to("#fh-s1-flash", { opacity: 0, duration: 0.1, ease: "power2.out" }, 0.153);
          tl.to(".s1-em", { color: PALETTE.lime, duration: 0.2, ease: "power1.out" }, 0.28);
          tl.to("#fh-s1-head", { scale: 1.015, duration: 0.7, ease: "sine.inOut" }, 0.5);

          /* ===== s2 · build (1.2–2.8) — word reveal 1.3, underline 2.0 ===== */
          tl.fromTo(
            "#fh-s2-mascot",
            { x: 0, y: 0, scale: 1 },
            { x: -34, y: -30, scale: 1.03, duration: 1.6, ease: "none" },
            1.2
          );
          tl.fromTo(
            "#fh-s2-head .w",
            { y: 150, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out", stagger: 0.09 },
            1.3
          );
          tl.fromTo("#fh-s2-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 2.0);

          /* ===== s3 · arrival (2.8–4.4) — POBLANO OPEN punch 2.9 ===== */
          tl.fromTo(
            "#fh-s3-title",
            { scale: 0.6, autoAlpha: 0 },
            { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(2.2)" },
            2.9
          );
          tl.fromTo(
            "#fh-s3-mascot",
            { x: 380, autoAlpha: 0 },
            { x: 0, autoAlpha: 0.7, duration: 0.6, ease: "power3.out" },
            3.0
          );
          tl.to("#fh-s3-mascot", { x: -24, y: -14, duration: 0.8, ease: "sine.out" }, 3.6);
          tl.fromTo(
            ".s3-ch",
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.02, ease: "none", stagger: 0.03 },
            3.1
          );
          tl.fromTo("#fh-s3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 3.25);
          tl.fromTo(
            "#fh-s3-sub",
            { y: 120, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out" },
            3.3
          );
