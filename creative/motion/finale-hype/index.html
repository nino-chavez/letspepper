<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Finale Hype — Let's Pepper</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #070707;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #070707;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- finale-hype scene composition (all visuals + timeline) -->
      <div
        id="finale-slot"
        data-composition-id="finale-hype"
        data-composition-src="compositions/index.html"
        data-start="0"
        data-duration="11"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- framework-owned audio — six cues per shot-plan.json, direct children of the host root -->
      <audio
        id="sfx-serve-snap"
        src="assets/audio/serve-snap.wav"
        data-start="0"
        data-duration="0.34"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="sfx-bracket-lock"
        src="assets/audio/bracket-lock.wav"
        data-start="4.4"
        data-duration="0.52"
        data-track-index="11"
        data-volume="1"
      ></audio>
      <audio
        id="sfx-energy-rise"
        src="assets/audio/energy-rise.wav"
        data-start="5.08"
        data-duration="0.92"
        data-track-index="12"
        data-volume="0.9"
      ></audio>
      <audio
        id="sfx-impact-slam"
        src="assets/audio/impact-slam.wav"
        data-start="5.95"
        data-duration="0.58"
        data-track-index="13"
        data-volume="1"
      ></audio>
      <audio
        id="sfx-sizzle-tail"
        src="assets/audio/sizzle-tail.wav"
        data-start="8.15"
        data-duration="0.78"
        data-track-index="14"
        data-volume="0.9"
      ></audio>
      <audio
        id="sfx-sonic-logo"
        src="assets/audio/sonic-logo.wav"
        data-start="9.9"
        data-duration="1.08"
        data-track-index="15"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
